name: videoclip-mvp-stage1

services:
  postgres:
    image: postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
    pull_policy: never
    environment:
      POSTGRES_DB: videoclip_mvp_stage1
      POSTGRES_USER: videoclip_stage1
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${MVP_STAGE1_PG_PORT:-55442}:5432"
    volumes:
      - type: bind
        source: ${MVP_STAGE1_DATA_DIR:?set MVP_STAGE1_DATA_DIR to the private E drive business directory}/postgres
        target: /var/lib/postgresql/data
    mem_limit: 768m
    pids_limit: 128
    stop_grace_period: 30s
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videoclip_stage1 -d videoclip_mvp_stage1"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

  api:
    build:
      context: .
      dockerfile: backend.Dockerfile
    image: videoclip-mvp-stage1-api:local
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ${MVP_STAGE1_ENV_FILE:?set MVP_STAGE1_ENV_FILE to the private stage-1 .env}
        required: true
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: videoclip_mvp_stage1
      DB_USER: videoclip_stage1
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      APP_DATA_ROOT: /appdata
      FFPROBE_PATH: /usr/bin/ffprobe
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${MVP_STAGE1_API_PORT:-58001}:8000"
    volumes:
      - type: bind
        source: ${MVP_STAGE1_DATA_DIR:?set MVP_STAGE1_DATA_DIR to the private E drive business directory}/app
        target: /appdata
    mem_limit: 1g
    pids_limit: 128
    restart: "no"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

secrets:
  postgres_password:
    file: ${MVP_STAGE1_DATA_DIR:?set MVP_STAGE1_DATA_DIR to the private E drive business directory}/secrets/postgres_password
